---
- hosts: all
  become: yes
  gather_facts: true
  vars:
    shield_service_name_v1: "{{ values.old_shield_service_name | default('shield-cpus.service') }}"
  tasks:
    - block:
      # 1. Gather Service Facts Early
      - name: Populate service facts
        ansible.builtin.service_facts:

      # 2. Validate system_cpus bounds
      - name: Validate system_cpus bounds
        ansible.builtin.script: "validate_cpus.py {{ ansible_processor_vcpus }} '{{ values.system_cpus }}'"
        args:
          executable: python3
        register: cpu_bounds_check
        ignore_errors: true
        changed_when: false

      - name: Fail if system_cpus exceeds physical hardware limits
        ansible.builtin.fail:
          msg: >-
            Validation Error: You requested to use CPU core {{ cpu_bounds_check.stdout | trim }},
            but this node only has {{ ansible_processor_vcpus }} logical vCPUs
            (valid cores are 0 to {{ ansible_processor_vcpus | int - 1 }}).
        when: cpu_bounds_check.rc != 0

      # 3. Detect Orchestrator dynamically via systemd units
      - name: Determine orchestrator (MKE vs k0s)
        ansible.builtin.set_fact:
          orchestrator: >-
            {{ 'k0s' if ('k0sworker.service' in ansible_facts.services or 'k0scontroller.service' in ansible_facts.services) else 'mke' }}

      # --- Pre-flight Check ---
      - name: k0s | Check if Kubelet drop-in directory exists
        ansible.builtin.stat:
          path: /etc/kubernetes/kubelet.conf.d
        register: kubelet_conf_dir
        when: orchestrator == 'k0s'

      - name: k0s | Fail if legacy Kaas release is detected
        ansible.builtin.fail:
          msg: >-
            The directory /etc/kubernetes/kubelet.conf.d is missing. This indicates
            you are deploying on an older Kaas release (e.g., 2.32) which lacks lcm-ansible
            support for Kubelet --config-dir injection. The cpushield day2 module requires
            a newer Kaas release to safely manage k0s workloads.
        when:
          - orchestrator == 'k0s'
          - not kubelet_conf_dir.stat.exists

      # 4. Universal OS Shielding Logic
      - name: Disable {{ shield_service_name_v1 }}
        ansible.builtin.command:
          cmd: "systemctl disable --no-reload {{ shield_service_name_v1 }}"
        notify:
          - Create a reboot request
        when:
          - (values.disable_old_shield_service | default(False)) | bool
          - shield_service_name_v1 in ansible_facts.services
          - ansible_facts.services[shield_service_name_v1]['status'] == 'enabled'

      - name: Define shield service and script names
        ansible.builtin.set_fact:
          shield_service_name: shield-cpu-numa-systemd-init-scope.service
          shield_script_name: shield-cpu-numa-systemd-init-scope.sh

      - name: Create unit file drop-in directory
        ansible.builtin.file:
          path: /etc/systemd/system/{{ item }}.d
          state: directory
        loop: "{{ values.systemd_units_to_pin | default([]) }}"

      - name: Create drop-in config file with CPU/NUMA pinning
        ansible.builtin.template:
          src: "99-shielding.conf.j2"
          dest: "/etc/systemd/system/{{ item }}.d/99-shielding.conf"
          mode: "0644"
        vars:
          unitList: "{{ item | split('.') }}"
          unitType: "{{ unitList | last | capitalize }}"
        notify:
          - Create a reboot request
        loop: "{{ values.systemd_units_to_pin | default([]) }}"

      - name: Create shield script
        ansible.builtin.template:
          src: "{{ shield_script_name }}.j2"
          dest: "/usr/bin/{{ shield_script_name }}"
          mode: "0755"
        notify:
          - Manage service
          - Create a reboot request

      - name: Create systemd service
        ansible.builtin.template:
          src: "{{ shield_service_name }}.j2"
          dest: "/etc/systemd/system/{{ shield_service_name }}"
          mode: "0644"
        notify:
          - Manage service
          - Create a reboot request

      # 5. k0s-Specific Iron Cage Logic
      - name: k0s | Calculate isolated CPUs from system CPUs
        ansible.builtin.script: "calculate_isolated_cpus.py {{ ansible_processor_vcpus }} '{{ values.system_cpus }}'"
        args:
          executable: python3
        register: isolated_cpus_cmd
        when: orchestrator == 'k0s'
        changed_when: false

      - name: k0s | Set isolated_cpus fact
        ansible.builtin.set_fact:
          isolated_cpus: "{{ isolated_cpus_cmd.stdout | trim }}"
        when: orchestrator == 'k0s'

      - name: k0s | Template Kubelet configuration drop-in
        ansible.builtin.template:
          src: "k0s-kubelet-cpushield.yaml.j2"
          dest: /etc/kubernetes/kubelet.conf.d/99-cpushield.conf
          mode: '0644'
        register: k0s_kubelet_config
        when: orchestrator == 'k0s'
        notify:
          - Create a reboot request

      - name: k0s | Wipe Kubelet CPU Manager state on config change
        ansible.builtin.file:
          path: /var/lib/kubelet/cpu_manager_state
          state: absent
        when:
          - orchestrator == 'k0s'
          - k0s_kubelet_config.changed

      # 6. Final Handlers
      - name: Apply CPU/NUMA pinning settings immediately
        ansible.builtin.command:
          cmd: "systemctl daemon-reload"
        when: (values.apply_settings_immediately | default(False)) | bool

      - name: Flush handlers
        ansible.builtin.meta: flush_handlers

      when:
        - ansible_distribution == 'Ubuntu'
        - ansible_distribution_version is version_compare('22.04', '>=')

    - name: Fail if distro is not Ubuntu 22.04 or newer
      ansible.builtin.fail:
        msg: "Module supports Ubuntu 22.04 or higher. Your distro is not allowed"
      when: (ansible_distribution != 'Ubuntu' or ansible_distribution_version is version_compare('22.04', '<'))

  handlers:
    - name: Manage service
      ansible.builtin.command:
        cmd: "systemctl enable --no-reload {{ shield_service_name }}"
      changed_when: true
      notify:
        - Create a reboot request

    - block:
      - name: Create /run/day2
        ansible.builtin.file:
          path: /run/day2
          state: directory
        listen: Create a reboot request

      - name: Update /run/day2/reboot-required with reboot reason
        ansible.builtin.lineinfile:
          path: "/run/day2/reboot-required"
          line: Reboot is requested due to (re)configuring CPU/NUMA shielding using cpushield day2 module
          create: true
        listen: Create a reboot request
      when: not ((values.disable_reboot_request | default(False)) | bool)
